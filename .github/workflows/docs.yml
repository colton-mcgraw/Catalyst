# Publishes the Doxygen API reference to GitHub Pages. The README links to the result, so this
# workflow is what stands behind that link.
#
# The Doxyfile is generated by CMake (see the docs target in CMakeLists.txt), which is why a
# compiler is installed and a configure step runs even though nothing is compiled: the top-level
# CMakeLists.txt checks for C++23 support before it does anything else. Every extra is switched
# off and the null backend is selected so the configure needs no SDKs and no network.
#
# The repository's Pages source must be set to "GitHub Actions" (Settings > Pages) once, or the
# deploy job is refused.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 doxygen

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -S . -B build -G Ninja
          -DCATALYST_RENDERING_BACKEND=null
          -DCATALYST_RESOURCE_STB=OFF
          -DCATALYST_BUILD_TESTS=OFF
          -DCATALYST_BUILD_EXAMPLES=OFF
          -DCATALYST_BUILD_BENCHMARKS=OFF

      - name: Generate
        run: cmake --build build --target docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
